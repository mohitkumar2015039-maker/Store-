<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सौरव राज फैशन स्टोर</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
        }

        header {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .admin-btn { background: #e91e63; border: none; font-weight: bold; }
        .cart-btn { background: #ff4081; border: none; font-weight: bold; }

        .owner-info {
            background-color: #222;
            color: #bbb;
            font-size: 12px;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #333;
        }

        /* फिल्टर कैटेगरी */
        .category-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #fff;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        .cat-btn {
            padding: 6px 15px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .price {
            color: #e91e63;
            font-size: 18px;
            font-weight: bold;
            margin: 6px 0;
        }

        .size-select {
            margin: 8px 0;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 100%;
        }

        .add-btn {
            background-color: #111;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* Modal Popups */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            border-radius: 10px;
            width: 320px;
            z-index: 100;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal input, .modal select {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px 0;
            box-sizing: border-box;
        }

        .order-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .close-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">👗 <span id="display-shop-name">सौरव फैशन कलेक्शन</span></div>
        <div class="header-controls">
            <button class="btn" onclick="toggleLanguage()">🌐 <span id="lang-text">English</span></button>
            <button class="btn admin-btn" onclick="toggleAdminModal()">➕ <span id="add-item-btn-text">सामान जोड़ें</span></button>
            <div class="btn cart-btn" onclick="toggleCart()">
                🛒 (<span id="cart-count">0</span>)
            </div>
        </div>
    </header>

    <!-- ऑनर और व्हाट्सएप नंबर की पट्टी -->
    <div class="owner-info">
        <span>👤 Owner: <strong id="display-owner-name">Sourav Raj</strong></span>
        <span>📱 WhatsApp: <strong id="display-phone-no">+91 9142972911</strong></span>
    </div>

    <!-- कैटेगरी चुनने का बार -->
    <div class="category-bar">
        <button class="cat-btn active" onclick="filterCategory('all', this)">सब (All)</button>
        <button class="cat-btn" onclick="filterCategory('kids', this)">बच्चों के कपड़े (Kids)</button>
        <button class="cat-btn" onclick="filterCategory('suit', this)">सूट (Suit)</button>
        <button class="cat-btn" onclick="filterCategory('kurti', this)">कुर्ती-प्लाज़ो (Kurti Plazo)</button>
    </div>

    <!-- सामान की लिस्ट -->
    <main class="products-container" id="products"></main>

    <!-- 1. फोटो अपलोड करने का फॉर्म -->
    <div class="modal" id="adminModal">
        <h3 id="admin-title">नया कपड़ा जोड़ें (Add Product)</h3>
        <label id="lbl-title">कपड़े का नाम:</label>
        <input type="text" id="p-name" placeholder="उदा: कॉटन कुर्ती सेट">
        
        <label id="lbl-price">कीमत (₹):</label>
        <input type="number" id="p-price" placeholder="उदा: 799">
        
        <label id="lbl-cat">कैटेगरी चुनिए:</label>
        <select id="p-category">
            <option value="kids">बच्चों के कपड़े (Kids)</option>
            <option value="suit">सूट (Suit)</option>
            <option value="kurti">कुर्ती-प्लाज़ो (Kurti Plazo)</option>
        </select>
        
        <label id="lbl-img">कपड़े की फोटो चुनें:</label>
        <input type="file" id="p-image" accept="image/*">
        
        <button class="order-btn" onclick="addNewProduct()" id="btn-save">अपलोड करें</button>
        <button class="close-btn" onclick="toggleAdminModal()" id="btn-cancel">रद्द करें</button>
    </div>

    <!-- 2. कार्ट पॉपअप -->
    <div class="modal" id="cartModal">
        <h3 id="cart-title">आपकी कार्ट</h3>
        <ul id="cart-items"></ul>
        <p><span id="total-label">कुल राशि</span>: <strong>₹<span id="total-price">0</span></strong></p>
        <button class="order-btn" id="order-btn-text" onclick="sendOrder()">WhatsApp पर ऑर्डर भेजें</button>
        <button class="close-btn" id="close-btn-text" onclick="toggleCart()">बंद करें</button>
    </div>

    <script>
        // ==========================================
        // 🚨 आपकी अपडेट की गई जानकारी
        // ==========================================
        const SHOP_NAME = "सौरव फैशन कलेक्शन";
        const OWNER_NAME = "Sourav Raj";
        const SHOP_PHONE_NUMBER = "919142972911";
        // ==========================================

        document.getElementById("display-shop-name").innerText = SHOP_NAME;
        document.getElementById("display-owner-name").innerText = OWNER_NAME;
        document.getElementById("display-phone-no").innerText = "+91 9142972911";

        let currentLang = 'hi';
        let currentCategory = 'all';

        const translations = {
            hi: {
                addItemBtn: "सामान जोड़ें",
                cartTitle: "आपकी कार्ट",
                totalLabel: "कुल राशि",
                orderBtn: "WhatsApp पर ऑर्डर भेजें",
                closeBtn: "बंद करें",
                addBtn: "कार्ट में डालें",
                sizeLabel: "साइज़: ",
                addedAlert: "कार्ट में जोड़ दिया गया है!",
                emptyAlert: "आपकी कार्ट खाली है!",
                orderGreeting: "नमस्ते Sourav Raj जी! मुझे यह कपड़े ऑर्डर करने हैं:\n\n",
                langText: "English",
                adminTitle: "नया कपड़ा जोड़ें",
                lblTitle: "कपड़े का नाम:",
                lblPrice: "कीमत (₹):",
                lblCat: "कैटेगरी चुनिए:",
                lblImg: "कपड़े की फोटो चुनें:",
                btnSave: "अपलोड करें",
                btnCancel: "रद्द करें"
            },
            en: {
                addItemBtn: "Add Product",
                cartTitle: "Your Cart",
                totalLabel: "Total Price",
                orderBtn: "Order on WhatsApp",
                closeBtn: "Close",
                addBtn: "Add to Cart",
                sizeLabel: "Size: ",
                addedAlert: "added to cart!",
                emptyAlert: "Your cart is empty!",
                orderGreeting: "Hello Sourav Raj! I would like to order these items:\n\n",
                langText: "हिंदी",
                adminTitle: "Add New Product",
                lblTitle: "Product Name:",
                lblPrice: "Price (₹):",
                lblCat: "Select Category:",
                lblImg: "Choose Photo:",
                btnSave: "Upload",
                btnCancel: "Cancel"
            }
        };

        let clothes = [
            { id: 1, name: "किड्स फ्रॉक ड्रेस", category: "kids", price: 499, image: "https://images.unsplash.com/photo-1622290291468-a28f7a7dc6a8?w=400" },
            { id: 2, name: "डिजाइनर अनारकली सूट", category: "suit", price: 1499, image: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=400" },
            { id: 3, name: "कॉटन कुर्ती प्लाज़ो सेट", category: "kurti", price: 899, image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400" }
        ];

        let cart = [];

        function renderProducts() {
            const productsContainer = document.getElementById("products");
            productsContainer.innerHTML = "";
            const t = translations[currentLang];

            const filteredList = currentCategory === 'all' 
                ? clothes 
                : clothes.filter(item => item.category === currentCategory);

            filteredList.forEach(item => {
                productsContainer.innerHTML += `
                    <div class="product-card">
                        <img src="${item.image}" alt="${item.name}">
                        <h3>${item.name}</h3>
                        <div class="price">₹${item.price}</div>
                        
                        <select id="size-${item.id}" class="size-select">
                            <option value="S">${t.sizeLabel}S</option>
                            <option value="M" selected>${t.sizeLabel}M</option>
                            <option value="L">${t.sizeLabel}L</option>
                            <option value="XL">${t.sizeLabel}XL</option>
                        </select>
                        
                        <button class="add-btn" onclick="addToCart(${item.id})">${t.addBtn}</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function addNewProduct() {
            const name = document.getElementById("p-name").value;
            const price = document.getElementById("p-price").value;
            const category = document.getElementById("p-category").value;
            const imageInput = document.getElementById("p-image");

            if (!name || !price || imageInput.files.length === 0) {
                alert("कृपया सभी जानकारी भरें और फोटो चुनें!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const newProduct = {
                    id: Date.now(),
                    name: name,
                    price: parseInt(price),
                    category: category,
                    image: e.target.result
                };

                clothes.unshift(newProduct);
                renderProducts();
                toggleAdminModal();
                alert("कपड़ा सफलतापूर्वक अपलोड हो गया!");

                document.getElementById("p-name").value = "";
                document.getElementById("p-price").value = "";
                document.getElementById("p-image").value = "";
            };

            reader.readAsDataURL(imageInput.files[0]);
        }

        function toggleAdminModal() {
            const modal = document.getElementById("adminModal");
            modal.style.display = modal.style.display === "block" ? "none" : "block";
        }

        function toggleLanguage() {
            currentLang = currentLang === 'hi' ? 'en' : 'hi';
            const t = translations[currentLang];

            document.getElementById("add-item-btn-text").innerText = t.addItemBtn;
            document.getElementById("cart-title").innerText = t.cartTitle;
            document.getElementById("total-label").innerText = t.totalLabel;
            document.getElementById("order-btn-text").innerText = t.orderBtn;
            document.getElementById("close-btn-text").innerText = t.closeBtn;
            document.getElementById("lang-text").innerText = t.langText;

            document.getElementById("admin-title").innerText = t.adminTitle;
            document.getElementById("lbl-title").innerText = t.lblTitle;
            document.getElementById("lbl-price").innerText = t.lblPrice;
            document.getElementById("lbl-cat").innerText = t.lblCat;
            document.getElementById("lbl-img").innerText = t.lblImg;
            document.getElementById("btn-save").innerText = t.btnSave;
            document.getElementById("btn-cancel").innerText = t.btnCancel;

            renderProducts();
            updateCart();
        }

        function addToCart(productId) {
            const item = clothes.find(p => p.id === productId);
            const selectedSize = document.getElementById(`size-${productId}`).value;
            const t = translations[currentLang];
            
            cart.push({ ...item, selectedSize });
            updateCart();
            alert(`${item.name} ${t.addedAlert}`);
        }

        function updateCart() {
            document.getElementById("cart-count").innerText = cart.length;
            const cartItemsList = document.getElementById("cart-items");
            cartItemsList.innerHTML = "";
            
            let total = 0;
            cart.forEach((item) => {
                total += item.price;
                cartItemsList.innerHTML += `<li>${item.name} (${item.selectedSize}) - ₹${item.price}</li>`;
            });
            
            document.getElementById("total-price").innerText = total;
        }

        function toggleCart() {
            const modal = document.getElementById("cartModal");
            modal.style.display = modal.style.display === "block" ? "none" : "block";
        }

        function sendOrder() {
            const t = translations[currentLang];
            if (cart.length === 0) {
                alert(t.emptyAlert);
                return;
            }

            let orderText = t.orderGreeting;
            let total = 0;
            cart.forEach(item => {
                orderText += `• ${item.name} [Size: ${item.selectedSize}] - ₹${item.price}\n`;
                total += item.price;
            });
            orderText += `\n*${t.totalLabel}:* ₹${total}`;

            const encodedText = encodeURIComponent(orderText);
            window.open(`https://wa.me/${SHOP_PHONE_NUMBER}?text=${encodedText}`, "_blank");
        }

        renderProducts();
    </script>
</body>
</html>
